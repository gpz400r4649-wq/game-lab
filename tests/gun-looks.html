<!doctype html><html lang="ja"><meta charset="utf-8"><title>銃の見た目の確認</title><style>body{font-family:system-ui;background:#edf2f8;color:#46516b;margin:12px}h1{font-size:18px;margin:8px 0}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));max-width:980px;margin:auto;gap:8px}article{background:white;border-radius:12px;padding:8px;text-align:center}h2{font-size:13px;margin:2px 0}.side svg{width:100%;height:78px}img{width:100%;height:115px;object-fit:contain;display:block}</style><h1>プレビューと3Dの形・銃口の向きの確認</h1><div class="gallery"></div><script type="module">
import * as T from '../vendor/three.module.min.js';import {GUN_SHAPES,gunPreviewSVG} from '../appearance3d.js';import {makeGunModel} from '../gun-model3d.js';const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(360,150);const scene=new T.Scene();scene.background=new T.Color('#eef3f9');scene.add(new T.HemisphereLight(0xffffff,0x668099,2.5));const light=new T.DirectionalLight(0xffffff,2);light.position.set(3,4,-3);scene.add(light);const camera=new T.PerspectiveCamera(35,360/150,.01,30);
for(const [shape,name]of Object.entries(GUN_SHAPES)){const tool={appearance:{shape,color:'#7d62dd',accent:'#ee91a5',barrel:1,suppressor:false}},model=makeGunModel(tool);scene.add(model);const bounds=new T.Box3().setFromObject(model),center=bounds.getCenter(new T.Vector3()),size=bounds.getSize(new T.Vector3()),distance=Math.max(size.z*.95,size.y*2.8,1.2);camera.position.copy(center).add(new T.Vector3(1.25,.65,-1.7).normalize().multiplyScalar(distance));camera.lookAt(center);renderer.render(scene,camera);const article=document.createElement('article'),title=document.createElement('h2'),side=document.createElement('div'),img=document.createElement('img');title.textContent=name;side.className='side';side.innerHTML=gunPreviewSVG(tool);img.src=renderer.domElement.toDataURL();img.alt=name+'の3Dモデル';article.append(title,side,img);document.querySelector('.gallery').append(article);scene.remove(model);}
</script></html>
